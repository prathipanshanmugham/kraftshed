services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kraftshed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: kraftshed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kraftshed"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/public/uploads

  # One-off tool container (has the Prisma CLI + tsx). Used by deploy.sh / seed.sh.
  tools:
    build:
      context: .
      target: builder
    env_file: .env
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
